server:
  port: 8082
  address: ${SERVER_ADDRESS:127.0.0.1}
spring:
  application:
    name: hotel-service
  datasource:
    url: jdbc:h2:mem:hotels;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=15000
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
app:
  jwt:
    secret: ${JWT_SECRET:demo-only-not-for-production-hotel-booking-secret-0000000000000000}
eureka:
  instance:
    hostname: localhost
    prefer-ip-address: false
  client:
    enabled: ${EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
logging:
  pattern:
    level: '%5p [traceId=%X{traceId}]'
