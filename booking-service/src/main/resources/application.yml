server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: 8081
spring:
  application:
    name: booking-service
  datasource:
    url: ${BOOKING_DB_URL:jdbc:h2:mem:booking;DB_CLOSE_DELAY=-1}
    username: ${BOOKING_DB_USER:sa}
    password: ${BOOKING_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
app:
  jwt:
    secret: ${JWT_SECRET:demo-only-not-for-production-hotel-booking-secret-0000000000000000}
hotel:
  base-url: ${HOTEL_BASE_URL:http://localhost:8082}
  timeout-ms: 1500
booking:
  compensation-delay-ms: 5000
  demo-users: ${DEMO_USERS:false}
eureka:
  instance:
    hostname: localhost
    prefer-ip-address: false
  client:
    enabled: ${EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
