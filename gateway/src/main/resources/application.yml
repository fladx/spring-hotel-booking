server:
  port: 8080
  address: 127.0.0.1
spring:
  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 5000
            response-timeout: 10s
  application:
    name: gateway
app:
  jwt:
    secret: ${JWT_SECRET:demo-only-not-for-production-hotel-booking-secret-0000000000000000}
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
management:
  endpoints:
    web:
      exposure:
        include: health,info
